<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London Pub Panic! – 6., 7. og 8. trinn (LK20)</title>
<style>
  :root {
    --pub-green: #143d29;
    --pub-green-dark: #0b2418;
    --pub-red: #9b1c1c;
    --pub-cream: #f9f5eb;
    --pub-paper: #fffdf8;
    --pub-wood: #3e2415;
    --pub-gold: #c99e32;
    --pub-gold-light: #f6e3a5;
    --pub-blue: #1e40af;
    --text-dark: #1f1610;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--pub-cream);
    background-image: radial-gradient(#ded4c0 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .awning {
    height: 22px;
    background: repeating-linear-gradient(
      90deg,
      var(--pub-green) 0px,
      var(--pub-green) 45px,
      #ffffff 45px,
      #ffffff 90px
    );
    border-bottom: 4px solid var(--pub-gold);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .topbar {
    background: var(--pub-wood);
    color: #fff;
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Georgia, serif;
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--pub-gold-light);
    cursor: pointer;
  }

  .top-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .btn-top {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.28);
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
  }

  .btn-top:hover {
    background: rgba(255,255,255,0.24);
    transform: translateY(-1px);
  }

  .btn-top.active {
    background: var(--pub-gold);
    color: var(--text-dark);
    border-color: #fff;
  }

  .btn-top.grade-pill {
    background: #fef3c7;
    color: #78350f;
    border-color: #f59e0b;
    font-weight: 800;
  }

  .btn-top.listen-active {
    background: #a855f7;
    color: #fff;
    border-color: #e9d5ff;
  }

  .btn-top.teacher-active {
    background: #38bdf8;
    color: #0f172a;
    border-color: #bae6fd;
  }

  .btn-top.download-btn {
    background: #10b981;
    color: #064e3b;
    border-color: #a7f3d0;
    font-weight: 700;
  }

  .container {
    max-width: 1140px;
    width: 100%;
    margin: 0 auto;
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .screen {
    display: none;
    animation: fadeIn 0.25s ease;
  }
  .screen.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-card {
    background: var(--pub-paper);
    border: 3px solid var(--pub-wood);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    text-align: center;
    margin-bottom: 20px;
  }

  .hero-title {
    font-family: Georgia, serif;
    font-size: 2.15rem;
    color: var(--pub-green);
    margin-bottom: 6px;
  }

  .hero-sub {
    font-size: 0.98rem;
    color: #5c4636;
    margin-bottom: 18px;
    max-width: 820px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.45;
  }

  /* GRADE & LK20 COMPETENCE SELECTOR */
  .grade-selector-box {
    background: #f8fafc;
    border: 3px solid var(--pub-wood);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 22px;
    text-align: left;
  }

  .grade-selector-header {
    font-family: Georgia, serif;
    font-size: 1.2rem;
    color: var(--pub-wood);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .grade-tabs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }

  .grade-tab {
    background: #fff;
    border: 2px solid #cbd5e1;
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    position: relative;
  }

  .grade-tab:hover {
    border-color: var(--pub-green);
    transform: translateY(-2px);
  }

  .grade-tab.active-grade {
    border: 3px solid var(--pub-green);
    background: #f0fdf4;
    box-shadow: 0 6px 16px rgba(20, 61, 41, 0.14);
  }

  .grade-tab-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 10px;
    margin-bottom: 6px;
  }

  .g6-badge { background: #dcfce7; color: #166534; }
  .g7-badge { background: #dbeafe; color: #1e40af; }
  .g8-badge { background: #f3e8ff; color: #6b21a8; }

  .grade-tab h3 {
    font-size: 1.15rem;
    color: var(--text-dark);
    margin-bottom: 4px;
  }

  .grade-tab p {
    font-size: 0.85rem;
    color: #475569;
    line-height: 1.35;
  }

  .lk20-info-banner {
    background: #fff;
    border-left: 5px solid var(--pub-green);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.9rem;
    color: #1e293b;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .lk20-info-banner strong {
    color: var(--pub-green);
  }

  .whiteboard-hero-banner {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff;
    border: 3px solid #38bdf8;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-align: left;
  }

  .whiteboard-hero-text h3 {
    font-family: Georgia, serif;
    font-size: 1.25rem;
    color: #7dd3fc;
    margin-bottom: 4px;
  }

  .whiteboard-hero-text p {
    font-size: 0.9rem;
    color: #e0f2fe;
    line-height: 1.4;
    max-width: 660px;
  }

  .btn-start-whiteboard {
    background: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 11px 18px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .mode-section-title {
    font-family: Georgia, serif;
    font-size: 1.18rem;
    color: var(--pub-wood);
    margin: 14px 0 10px;
    text-align: left;
    border-bottom: 2px solid #e6dcc8;
    padding-bottom: 6px;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .mode-card {
    background: #fff;
    border: 2px solid #dfd3be;
    border-radius: 14px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .mode-card:hover {
    border-color: var(--pub-green);
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(20, 61, 41, 0.15);
  }

  .mode-card.comp {
    background: linear-gradient(135deg, #fffdf9 0%, #fff4dc 100%);
    border-color: var(--pub-gold);
  }

  .mode-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 12px;
    margin-bottom: 8px;
    width: fit-content;
  }

  .badge-comp { background: var(--pub-red); color: #fff; }
  .badge-lvl1 { background: #dcfce7; color: #166534; }
  .badge-lvl2 { background: #dbeafe; color: #1e40af; }
  .badge-lvl3 { background: #fef3c7; color: #92400e; }

  .mode-card h3 {
    font-size: 1.12rem;
    margin-bottom: 6px;
  }

  .mode-card p {
    font-size: 0.88rem;
    color: #555;
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .mode-start-btn {
    background: var(--pub-green);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    font-size: 0.92rem;
  }

  .mode-start-btn:hover {
    background: var(--pub-green-dark);
  }

  .leaderboard-box {
    background: #fff;
    border: 2px solid #dfd3be;
    border-radius: 14px;
    padding: 18px;
    margin-top: 12px;
    text-align: left;
  }

  .leaderboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .leaderboard-table th, .leaderboard-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
  }

  .hud {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
    background: #fff;
    border: 2px solid var(--pub-wood);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }

  .hud-item { display: flex; flex-direction: column; }
  .hud-label { font-size: 0.72rem; text-transform: uppercase; color: #777; font-weight: 700; }
  .hud-val { font-size: 1.15rem; font-weight: 800; }

  .streak-pill {
    display: inline-block;
    background: #ffedd5;
    color: #c2410c;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 800;
  }

  .customer-stage {
    background: linear-gradient(180deg, #fffdf8 0%, #f4ead6 100%);
    border: 3px solid var(--pub-wood);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 16px;
    align-items: center;
  }

  @media (max-width: 640px) {
    .customer-stage { grid-template-columns: 1fr; text-align: center; }
  }

  .customer-avatar-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    border: 2px solid #e2d5be;
    border-radius: 14px;
    padding: 10px;
  }

  .customer-emoji { font-size: 3.2rem; }
  .customer-name { font-weight: 800; font-size: 0.9rem; margin-top: 4px; color: var(--pub-wood); }
  .customer-origin {
    font-size: 0.73rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 3px;
  }
  .origin-uk { background: #dbeafe; color: #1e3a8a; }
  .origin-us { background: #fee2e2; color: #991b1b; }

  .speech-bubble {
    background: #fff;
    border: 2px solid var(--pub-wood);
    border-radius: 14px;
    padding: 16px 20px;
  }

  .order-english {
    font-family: Georgia, serif;
    font-size: 1.35rem;
    line-height: 1.45;
    margin-bottom: 12px;
  }

  .listening-hidden-box {
    background: #faf5ff;
    border: 2px dashed #a855f7;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #581c87;
    font-weight: 700;
  }

  .btn-reveal-text {
    background: #f3e8ff;
    color: #6b21a8;
    border: 1px solid #c084fc;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.84rem;
  }

  body.whiteboard-active .order-english {
    font-size: 1.8rem;
    font-weight: 600;
  }

  .order-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }

  .audio-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }

  .btn-audio {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    padding: 7px 13px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .calm-status-badge {
    display: none;
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #a7f3d0;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  .timer-wrap {
    margin-top: 10px;
    background: #e5e7eb;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid #cbd5e1;
  }

  .timer-bar {
    height: 100%;
    width: 100%;
    background: var(--pub-green);
    transition: width 0.25s linear, background-color 0.25s ease;
  }

  .teacher-toolbar {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px dashed #cbd5e1;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }

  body.whiteboard-active .teacher-toolbar { display: flex; }

  .teacher-toolbar-left, .teacher-toolbar-right {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .teacher-label {
    font-size: 0.76rem;
    font-weight: 800;
    text-transform: uppercase;
    color: #0369a1;
    background: #e0f2fe;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .btn-teacher-tool {
    background: #f8fafc;
    color: #1e293b;
    border: 1px solid #94a3b8;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-teacher-tool.active {
    background: #0284c7;
    color: #fff;
    border-color: #0369a1;
  }

  .btn-teacher-tool.grade-active {
    background: var(--pub-green);
    color: #fff;
    border-color: var(--pub-green-dark);
  }

  .grammar-breakdown {
    display: none;
    margin-top: 12px;
    background: #f8fafc;
    border: 2px solid #93c5fd;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.94rem;
  }

  .grammar-breakdown.show { display: block; }

  .grammar-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .g-chip {
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .g-chip.art-a { background: #dbeafe; color: #1e3a8a; border: 1px solid #93c5fd; }
  .g-chip.art-an { background: #fce7f3; color: #831843; border: 1px solid #f9a8d4; }
  .g-chip.plural { background: #fef3c7; color: #78350f; border: 1px solid #fde68a; }
  .g-chip.neg { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .g-chip.usuk { background: #f3e8ff; color: #581c87; border: 1px solid #d8b4fe; }

  .feedback-banner {
    display: none;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-weight: 700;
    font-size: 0.96rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .feedback-banner.show { display: flex; }
  .feedback-banner.error { background: #fef2f2; border: 2px solid #ef4444; color: #991b1b; }
  .feedback-banner.success { background: #f0fdf4; border: 2px solid #22c55e; color: #166534; }

  .btn-next-customer {
    background: #15803d;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
  }

  .workspace {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 16px;
  }

  @media (max-width: 820px) {
    .workspace { grid-template-columns: 1fr; }
  }

  .counter-box, .tray-box {
    background: var(--pub-paper);
    border: 3px solid var(--pub-wood);
    border-radius: 16px;
    padding: 16px;
  }

  .box-title {
    font-family: Georgia, serif;
    font-size: 1.15rem;
    color: var(--pub-wood);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #ece2d0;
    padding-bottom: 6px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
    gap: 10px;
  }

  .food-btn {
    background: #fff;
    border: 2px solid #ded2bd;
    border-radius: 12px;
    padding: 10px 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: all 0.14s;
  }

  .food-btn:hover {
    border-color: var(--pub-green);
    transform: translateY(-2px);
  }

  .food-emoji { font-size: 2.2rem; margin-bottom: 4px; }
  .food-name { font-weight: 700; font-size: 0.82rem; line-height: 1.2; margin-bottom: 4px; }
  .hide-labels .food-name { display: none; }

  .food-price {
    background: var(--pub-gold-light);
    color: var(--pub-wood);
    font-weight: 800;
    font-size: 0.78rem;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .tray-surface {
    min-height: 175px;
    background: #f4ead5;
    border: 3px dashed #bda782;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
    margin-bottom: 12px;
  }

  .tray-empty {
    width: 100%;
    text-align: center;
    color: #8c7658;
    font-size: 0.9rem;
    margin: auto 0;
    padding: 20px 0;
  }

  .tray-pill {
    background: #fff;
    border: 2px solid var(--pub-wood);
    border-radius: 10px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .tray-pill:hover {
    background: #fee2e2;
    border-color: #ef4444;
  }

  .tray-actions { display: flex; gap: 8px; }

  .btn-clear {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-serve {
    flex: 1;
    background: var(--pub-green);
    color: #fff;
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.62);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-backdrop.show { display: flex; }

  .modal-card {
    background: var(--pub-paper);
    border: 4px solid var(--pub-wood);
    border-radius: 18px;
    max-width: 660px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 22px;
  }

  .receipt-box {
    background: #fff;
    border: 2px dashed #cbbba0;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 12px 0 14px;
    font-size: 0.94rem;
  }

  .receipt-line {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dotted #e5e7eb;
  }

  .polite-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top:
